<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#182728"><title>Memories</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<main id="game">
 <canvas id="world" width="1100" height="620" aria-label="回忆冒险游戏场景"></canvas>
 <header id="hud"><div><span id="chapter">序章 / 一次约定</span><h1 id="location">她的家</h1></div><div class="header-right"><span id="progress">回忆 0 / 3</span><button id="menuBtn" aria-label="打开菜单">☰</button></div></header>
 <div id="objective"></div><div id="toast" role="status"></div>
 <div id="controls"><div id="joystick" aria-label="拖动摇杆移动"><div id="stick"></div></div><div id="interaction"><span id="nearLabel">靠近物件探索</span><button id="action" aria-label="互动">互动<span>E / 空格</span></button></div></div>
 <div id="dialog" class="panel hidden" role="dialog" aria-label="剧情对话"><span id="speaker"></span><p id="line"></p><button id="next">继续 <span>→</span></button></div>
 <div id="fade"><span id="chapterTitle" role="status" aria-live="polite"></span></div>
 <section id="titleScreen" class="overlay"><div class="intro-card"><p class="eyebrow">A LITTLE JOURNEY, JUST FOR YOU</p><h2 class="memories-title">Memories</h2><p class="subtitle">把一起走过的日子，再走一遍。</p><div class="divider"></div><button id="start" class="primary">开始这段旅程 <span>→</span></button><button id="continue" class="quiet hidden">继续上次的回忆</button><p class="small muted">手机：左侧摇杆移动 · 右侧按钮互动<br>电脑：WASD / 方向键 · E / 空格</p></div></section>
 <section id="menu" class="overlay hidden"><div class="menu-card"><p class="eyebrow">TAKE YOUR TIME</p><h2>歇一会儿</h2><button id="resume" class="primary">继续旅程</button><button id="returnRoom" class="quiet hidden">返回房间（本次未完成）</button><button id="restart" class="quiet">重新开始</button><p id="restartNote" class="small"></p></div></section>
 <section id="film" class="overlay hidden"><div class="film-card"><p class="eyebrow">NOW SHOWING · 回忆放映室</p><div class="film-art"><span class="moon"></span><span class="horizon"></span><p>和你一起看的风景</p></div><p id="filmCaption">《一起看星星》 · 原创爱情短片</p><progress id="filmProgress" max="12" value="0"></progress><button id="leaveFilm" class="quiet">提前离场（不完成回忆）</button></div></section>
 <section id="milestone" class="overlay hidden"><div class="menu-card"><h2>下一站，<br>回忆长廊。</h2><button id="stay" class="primary">看看房间</button><button id="again" class="quiet">重新体验旅程</button></div></section>
 <div id="rotate">横屏游玩，风景更完整 ↻</div>
</main><script type="module" src="./src/main.js"></script>
</body></html>
